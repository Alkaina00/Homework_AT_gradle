plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

group = 'ru.alfa'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.datafaker:datafaker:1.9.0'
    implementation 'com.github.lalyos:jfiglet:0.0.8'

    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testImplementation 'org.junit.platform:junit-platform-suite:1.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'io.cucumber:cucumber-java:7.14.1'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.14.1'

    testImplementation 'io.rest-assured:rest-assured:5.3.0'
    testImplementation 'org.hamcrest:hamcrest-all:1.3'
    testImplementation 'io.rest-assured:json-path:5.3.0'
    testImplementation 'com.codeborne:selenide:7.3.1'

    testImplementation 'io.qameta.allure:allure-junit5:2.21.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.19'
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    agent 'org.aspectj:aspectjweaver:1.9.19'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-encoding' << 'UTF-8'
}

test {
    useJUnitPlatform()

    jvmArgs = ["-javaagent:${configurations.agent.asPath}"]

    systemProperty "cucumber.filter.tags", System.getProperty("cucumber.filter.tags")

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

allure {
    version = '2.21.0'
    useJUnit5 {
        version = '2.21.0'
    }
}